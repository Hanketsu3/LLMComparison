name: notebook-smoke

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  notebook-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install nbconvert jupyter ipykernel

    - name: Run smoke test notebook
      run: |
        jupyter nbconvert --to notebook --execute \
          --ExecutePreprocessor.timeout=300 \
          notebooks/00_repo_smoke_test.ipynb \
          --output-dir=./executed_notebooks

    - name: Archive notebook outputs
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: executed-notebooks
        path: executed_notebooks/

    - name: Check for test failures
      if: always()
      run: |
        if grep -q "❌ FAIL" executed_notebooks/00_repo_smoke_test.ipynb; then
          echo "Smoke test failed"
          exit 1
        fi
