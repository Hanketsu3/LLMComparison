name: llmcomp-generic-hf
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
    - torch>=2.1.0,<2.4.0
    - torchvision>=0.16.0
    - transformers>=4.45.0,<4.58.0
    - accelerate>=0.34.0
    - bitsandbytes>=0.43.0
    - datasets>=2.20.0
    - evaluate>=0.4.2
    - scipy>=1.11.0
    - numpy>=1.24.0
    - pandas>=2.0.0
    - pyyaml>=6.0
    - tqdm>=4.66.0
    - Pillow>=10.0.0
    - rich>=13.0.0
    - typer>=0.12.0
    - jupyter>=1.0.0
    - ipykernel>=6.29.0
    # Optional runtime acceleration
    - vllm>=0.8.0
    - flash-attn>=2.6.0 ; platform_system != 'Darwin'
